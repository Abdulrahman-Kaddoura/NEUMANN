<!DOCTYPE html>
<html>

<head>
    <title>Hello World</title>
    <style>
        .button-on {
            background-color: green;
            border-radius: 5px;
            color: white;
            padding: 10px 20px;
            border: none;
            font-family: Arial;
            cursor: pointer;
        }

        .button-off {
            background-color: red;
            border-radius: 5px;
            color: white;
            padding: 10px 20px;
            border: none;
            font-family: Arial;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        function Button() {
            const [isButtonOn, setIsButtonOn] = React.useState("ON");
            function toggleMode() {
                isButtonOn === "ON" ? setIsButtonOn("OFF") : setIsButtonOn("ON");
            }
            return (
                <button className={isButtonOn === "ON" ? 'button-on' : 'button-off'} onClick={toggleMode}>{isButtonOn}</button>
            );  
        }
    

        function App() {
            return (
                <>
                    <Button />
                </>
            );
        }

        const container = document.querySelector('.js-container');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>

</html>
